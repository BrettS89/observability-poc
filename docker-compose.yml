services:
  customer-api:
    image: node:20-alpine
    working_dir: /app
    container_name: customer-api
    volumes:
      - ./customer-api:/app
    command: sh -c "npm install && npm run dev"
    depends_on:
      - ingest-engine
    environment:
      - OTEL_SERVICE_NAME=customer-api
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://ingest-engine:4008
    ports:
      - "4006:4006"
      - "9464:9464"

  observability-api:
    image: node:20-alpine
    working_dir: /app
    depends_on:
      observability-pg:
        condition: service_healthy
    volumes:
      - ./observability-api:/app
    command: sh -c "npm install && npm run migrate:up && npm run dev"
    environment:
      DATABASE_URL: postgres://root:root@observability-pg:5432/observability
      POSTGRES_URL: postgres://root:root@observability-pg:5432/observability
      PGHOST: observability-pg
      PGPORT: 5432
      PGUSER: root
      PGPASSWORD: root
      PG_DATABASE: observability
      API_KEY_ENCRYPTION_KEY: ebcef99b0275a9316322c36c9518ede0a56ed5b630090ed76716e7a63f297809
      API_KEY_PEPPER: afe4550452606ca9571b65a2ff26f10ee1b15293c74d93c0d9c8646303c43e8c
    ports:
      - "4007:4007"

  # observability-web:
  #   build:
  #     context: ./observability-web
  #     dockerfile: Dockerfile.dev
  #   container_name: observability-web
  #   env_file:
  #     - ./observability-web/.env
  #   ports:
  #     - "5173:5173"
  #   restart: unless-stopped
  #   volumes:
  #     - ./observability-web:/app
  #     - /app/node_modules   

  ingest-engine:
    image: node:20-alpine
    working_dir: /app
    container_name: ingest-engine
    volumes:
      - ./ingest-engine:/app
    command: sh -c "npm install && npm run dev"
    environment:
      - PORT=4008
    ports:
      - "4008:4008"

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO console UI
    volumes:
      - minio-data:/data

  # Creates the buckets Mimir expects
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO...' ;
      until mc alias set local http://minio:9000 minio minio12345 2>/dev/null; do
        sleep 1;
      done;
      echo 'MinIO is up. Creating buckets...' ;
      mc mb -p local/mimir-blocks || true;
      mc mb -p local/mimir-ruler || true;
      mc mb -p local/mimir-alertmanager || true;
      echo 'Buckets created.';
      "

  mimir:
    image: grafana/mimir:latest
    container_name: mimir
    depends_on:
      - minio
      - minio-init
    command:
      - "-config.file=/etc/mimir/mimir.yaml"
    ports:
      - "9009:9009"   # Mimir HTTP API (remote_write, query, etc.)
    volumes:
      - ./mimir.yaml:/etc/mimir/mimir.yaml:ro
      - mimir-data:/data

  observability-pg:
    image: postgres:16
    container_name: observability-pg
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: observability
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d observability"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - observability_pg_data:/var/lib/postgresql/data

volumes:
  minio-data:
  mimir-data:
  observability_pg_data:
